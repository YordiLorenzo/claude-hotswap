<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c0c10"/>
      <stop offset="100%" stop-color="#16161e"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="bolt-grad" x1="240" y1="120" x2="280" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="40%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="arrow-left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="arrow-right" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <filter id="bolt-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feFlood flood-color="#FBBF24" flood-opacity="0.4"/>
      <feComposite in2="blur" operator="in" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
    <filter id="arrow-glow-l" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feFlood flood-color="#8B5CF6" flood-opacity="0.35"/>
      <feComposite in2="blur" operator="in" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
    <filter id="arrow-glow-r" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feFlood flood-color="#F59E0B" flood-opacity="0.35"/>
      <feComposite in2="blur" operator="in" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="72" fill="url(#bg)"/>

  <!-- Subtle radial highlight -->
  <circle cx="256" cy="240" r="200" fill="#FBBF24" opacity="0.02"/>

  <!-- LEFT ARROW (purple, pointing left) -->
  <g filter="url(#arrow-glow-l)">
    <!-- Arrow shaft -->
    <rect x="80" y="196" width="140" height="16" rx="8" fill="url(#arrow-left)" opacity="0.9"/>
    <!-- Arrow head -->
    <polygon points="80,172 80,236 36,204" fill="#8B5CF6" opacity="0.9"/>
  </g>

  <!-- RIGHT ARROW (amber, pointing right) -->
  <g filter="url(#arrow-glow-r)">
    <!-- Arrow shaft -->
    <rect x="292" y="300" width="140" height="16" rx="8" fill="url(#arrow-right)" opacity="0.9"/>
    <!-- Arrow head -->
    <polygon points="432,276 432,340 476,308" fill="#F59E0B" opacity="0.9"/>
  </g>

  <!-- Center lightning bolt -->
  <g filter="url(#bolt-glow)">
    <path d="M 290 108 L 232 244 L 268 244 L 222 404 L 310 220 L 270 220 Z"
          fill="url(#bolt-grad)"/>
  </g>

  <!-- Bolt edge highlight -->
  <path d="M 290 108 L 232 244 L 268 244 L 222 404 L 310 220 L 270 220 Z"
        fill="none" stroke="#FDE68A" stroke-width="1" opacity="0.3"/>
</svg>
